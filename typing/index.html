<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Mushal D. AlRuwaili">
<title>سرعة الطباعة | م. مشعل الرويلي</title>
<meta name="description" content="اختبر وطور سرعة الطباعة لديك باللغتين العربية والإنجليزية. تمرين كتابة احترافي.">
<meta name="keywords" content="سرعة الطباعة, تمرين كتابة, اختبار سرعة الكتابة, طباعة عربي, Arabic typing test, English typing practice, WPM test">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1B2027;
    --bg-raised:#242B35;
    --bg-sunken:#161A20;
    --line:#333C49;
    --ink:#E8E6E1;
    --ink-dim:#8B92A0;
    --ink-faint:#5A6270;
    --amber:#D4A15C;
    --amber-dim:#8A6B3E;
    --sage:#8FB58C;
    --terracotta:#C4736B;
    --radius:10px;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic','IBM Plex Mono',sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
  }
  .wrap{ width:100%; max-width:760px; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:36px;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    color:var(--amber);
    letter-spacing:.04em;
    border:1px solid var(--amber-dim);
    border-radius:6px;
    padding:2px 8px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0;
  }
  .controls-group {
    display: flex;
    gap: 10px;
  }
  .lang-toggle{
    display:flex;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:14px;
    padding:7px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .lang-toggle button.active{
    background:var(--amber);
    color:var(--bg-sunken);
    font-weight:600;
  }

  .stats{
    display:flex;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:22px;
  }
  .stat{
    flex:1;
    background:var(--bg-raised);
    padding:16px 14px;
    text-align:center;
  }
  .stat-label{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .stat-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .stat-value.accent{ color:var(--amber); }

  .stage{
    position:relative;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 30px;
    margin-bottom:18px;
    cursor:text;
  }
  .stage.locked{ opacity:.55; }
  .text-display{
    font-size:22px;
    line-height:1.9;
    font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;
  }
  .text-display.lang-ar{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    direction:rtl;
    text-align:right;
    font-size:23px;
  }
  .text-display.lang-en{
    direction:ltr;
    text-align:left;
  }
  .ch{ color:var(--ink-faint); border-bottom:2px solid transparent; }
  .ch.correct{ color:var(--sage); }
  .ch.incorrect{ color:var(--terracotta); border-bottom-color:var(--terracotta); }
  .ch.current{ background:var(--amber); color:var(--bg-sunken); border-radius:3px; }

  .hidden-input{
    position:absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity:0;
    cursor:text;
    z-index: 10;
  }

  .stage-hint{
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
    margin-bottom:28px;
  }

  .controls{
    display:flex;
    justify-content:center;
    margin-bottom:44px;
  }
  .restart-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:inherit;
    font-size:14px;
    padding:9px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .restart-btn:hover{
    border-color:var(--amber-dim);
    color:var(--amber);
  }

  .history-head{
    font-size:14px;
    color:var(--ink-dim);
    margin-bottom:12px;
    padding-inline-start:2px;
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .history-row{
    background:var(--bg-raised);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    font-size:14px;
  }
  .history-row .h-left{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ink-dim);
  }
  .history-row .h-lang{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1px 6px;
  }
  .history-row .h-metrics{
    display:flex;
    gap:18px;
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
  }
  .history-row .h-wpm{ color:var(--amber); font-weight:600; }
  .history-empty{
    background:var(--bg-raised);
    padding:22px 16px;
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
  }

  .result-banner{
    display:none;
    text-align:center;
    padding:22px;
    margin-bottom:18px;
    background:var(--bg-raised);
    border:1px solid var(--amber-dim);
    border-radius:var(--radius);
  }
  .result-banner.show{ display:block; }
  .result-banner .r-title{
    color:var(--ink-dim);
    font-size:13px;
    margin-bottom:10px;
  }
  .result-banner .r-numbers{
    display:flex;
    justify-content:center;
    gap:34px;
  }
  .result-banner .r-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:30px;
    font-weight:600;
    color:var(--amber);
  }
  .result-banner .r-num-label{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
  }
  .footer-credit {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    margin-top: 40px;
  }

  @media (max-width:520px){
    .stats{ flex-wrap:wrap; }
    .stat{ min-width:33%; }
    .stage{ padding:24px 18px; }
    .text-display{ font-size:19px; }
    .result-banner .r-numbers{ gap:20px; }
    .controls-group { flex-direction: column; align-items: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="brand-mark">WPM</span>
      <h1 id="title">سرعة الطباعة</h1>
    </div>
    <div class="controls-group">
      <div class="lang-toggle">
        <button id="btn-punct" class="active">ترقيم ✔</button>
      </div>
      <div class="lang-toggle">
        <button id="btn-ar" class="active">العربية</button>
        <button id="btn-en">English</button>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-label" id="lbl-time">الوقت المتبقي</div>
      <div class="stat-value accent" id="val-time">60</div>
    </div>
    <div class="stat">
      <div class="stat-label" id="lbl-wpm">الكلمات/دقيقة</div>
      <div class="stat-value" id="val-wpm">0</div>
    </div>
    <div class="stat">
      <div class="stat-label" id="lbl-acc">الدقة</div>
      <div class="stat-value" id="val-acc">100%</div>
    </div>
  </div>

  <div class="result-banner" id="result-banner">
    <div class="r-title" id="result-title">انتهى التمرين</div>
    <div class="r-numbers">
      <div>
        <div class="r-num" id="result-wpm">0</div>
        <div class="r-num-label" id="result-wpm-label">كلمة/دقيقة</div>
      </div>
      <div>
        <div class="r-num" id="result-acc">0%</div>
        <div class="r-num-label" id="result-acc-label">دقة</div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="text-display lang-ar" id="text-display"></div>
    <input type="text" class="hidden-input" id="hidden-input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <div class="stage-hint" id="stage-hint">ابدأ بالكتابة لتشغيل المؤقّت · اضغط في أي مكان للتركيز</div>

  <div class="controls">
    <button class="restart-btn" id="restart-btn">نص جديد</button>
  </div>

  <div class="history-head" id="history-head">النتائج السابقة</div>
  <div class="history-list" id="history-list"></div>

  <div class="footer-credit" id="footer-credit">تطوير م. مشعل الرويلي</div>

</div>

      "The deep ocean conceals unimaginable secrets, hosting marine creatures with bizarre shapes and glowing colors. Diving into these dark blue realms gives us a glimpse of Earth's incredible biological diversity. Protecting these delicate coral reefs and marine environments is a collective responsibility to ensure ecological balance for future generations.",
      "Science fiction has always been the window through which we envision the future of humanity. Many technologies we use today, like smart devices and voice assistants, were once mere fictional concepts in old stories. This proves that imagination is the very first seed of every real and tangible innovation.",
      "Learning to play a new musical instrument is an excellent exercise for activating both sides of the brain simultaneously. The rapid finger movements on piano keys or guitar strings require intense focus and coordination. Music is a universal language that helps express deep emotions and relieves accumulated daily stress.",
      "Traveling and exploring new countries is not mere entertainment; it is a profound school for embracing diversity. When you mix with unfamiliar cultures and taste exotic local foods, your perspective broadens significantly. Every journey you undertake leaves a lasting mark on your personality and creates truly unforgettable lifelong memories.",
      "Artificial intelligence has seamlessly integrated into our daily routines, drastically speeding up tasks that used to take hours. Instead of fearing these advancements, we should learn to utilize them smartly to boost our productivity. Continuous technological progress simply requires an adaptable mindset and a willingness to learn new skills."
    ]
  };

  const strings = {
    ar: {
      title: "سرعة الطباعة",
      timeLabel: "الوقت المتبقي",
      wpmLabel: "الكلمات/دقيقة",
      accLabel: "الدقة",
      hintIdle: "ابدأ بالكتابة لتشغيل المؤقّت · اضغط في أي مكان للتركيز",
      hintRunning: "استمر... التوقيت يعمل الآن",
      hintLocked: "انتهى الوقت — اضغط «نص جديد» للمحاولة مجدداً",
      restart: "نص جديد",
      historyHead: "النتائج السابقة",
      resultTitle: "انتهى التمرين",
      resultWpmLabel: "كلمة/دقيقة",
      resultAccLabel: "دقة",
      empty: "لا توجد نتائج بعد — أكمل تمريناً لتظهر هنا",
      punctOn: "ترقيم ✔",
      punctOff: "ترقيم ✖",
      footer: "تطوير م. مشعل الرويلي"
    },
    en: {
      title: "Type Pace",
      timeLabel: "Time left",
      wpmLabel: "WPM",
      accLabel: "Accuracy",
      hintIdle: "Start typing to begin the timer · click anywhere to focus",
      hintRunning: "Keep going... the clock is running",
      hintLocked: "Time's up — click \"New text\" to try again",
      restart: "New text",
      historyHead: "Previous results",
      resultTitle: "Session complete",
      resultWpmLabel: "words / min",
      resultAccLabel: "accuracy",
      empty: "No results yet — finish a session to see it here",
      punctOn: "Punct ✔",
      punctOff: "Punct ✖",
      footer: "Developed by Mushal D. AlRuwaili"
    }
  };

  let lang = 'ar';
  let usePunct = true;
  let targetText = '';
  let targetTextArr = [];
  let startTime = null;
  let timerId = null;
  let timeLeft = 60;
  let finished = false;
  let typed = []; 

  const els = {
    title: document.getElementById('title'),
    btnAr: document.getElementById('btn-ar'),
    btnEn: document.getElementById('btn-en'),
    btnPunct: document.getElementById('btn-punct'),
    lblTime: document.getElementById('lbl-time'),
    lblWpm: document.getElementById('lbl-wpm'),
    lblAcc: document.getElementById('lbl-acc'),
    valTime: document.getElementById('val-time'),
    valWpm: document.getElementById('val-wpm'),
    valAcc: document.getElementById('val-acc'),
    stage: document.getElementById('stage'),
    textDisplay: document.getElementById('text-display'),
    hiddenInput: document.getElementById('hidden-input'),
    stageHint: document.getElementById('stage-hint'),
    restartBtn: document.getElementById('restart-btn'),
    historyHead: document.getElementById('history-head'),
    historyList: document.getElementById('history-list'),
    resultBanner: document.getElementById('result-banner'),
    resultTitle: document.getElementById('result-title'),
    resultWpm: document.getElementById('result-wpm'),
    resultWpmLabel: document.getElementById('result-wpm-label'),
    resultAcc: document.getElementById('result-acc'),
    resultAccLabel: document.getElementById('result-acc-label'),
    footerCredit: document.getElementById('footer-credit')
  };

  function pickText(){
    const pool = texts[lang];
    let selected = pool[Math.floor(Math.random() * pool.length)];
    if (!usePunct) {
      selected = selected.replace(/[.,،؛:؟!]/g, '').replace(/\s{2,}/g, ' ').trim();
    }
    return selected;
  }

  function applyLangStrings(){
    const s = strings[lang];
    els.title.textContent = s.title;
    document.title = (lang === 'ar' ? 'سرعة الطباعة | م. مشعل الرويلي' : 'Type Pace | Mushal D. AlRuwaili');
    els.lblTime.textContent = s.timeLabel;
    els.lblWpm.textContent = s.wpmLabel;
    els.lblAcc.textContent = s.accLabel;
    els.stageHint.textContent = s.hintIdle;
    els.restartBtn.textContent = s.restart;
    els.historyHead.textContent = s.historyHead;
    els.resultTitle.textContent = s.resultTitle;
    els.resultWpmLabel.textContent = s.resultWpmLabel;
    els.resultAccLabel.textContent = s.resultAccLabel;
    els.footerCredit.textContent = s.footer;
    els.btnPunct.textContent = usePunct ? s.punctOn : s.punctOff;
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang === 'ar' ? 'ar' : 'en');
  }

  function renderText(){
    els.textDisplay.className = 'text-display ' + (lang === 'ar' ? 'lang-ar' : 'lang-en');
    els.textDisplay.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < targetTextArr.length; i++){
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = targetTextArr[i];
      frag.appendChild(span);
    }
    els.textDisplay.appendChild(frag);
  }

  function updateDisplayFromTyped(){
    const chars = els.textDisplay.children;
    for (let i = 0; i < chars.length; i++){
      const span = chars[i];
      span.classList.remove('correct','incorrect','current');
      
      if (i < typed.length){
        span.classList.add(typed[i] === targetTextArr[i] ? 'correct' : 'incorrect');
      } else if (i === typed.length){
        span.classList.add('current');
      }
    }
  }

  function computeLiveStats(){
    const elapsedMin = startTime ? (Date.now() - startTime) / 60000 : 0;
    let correctChars = 0;
    for (let i = 0; i < typed.length; i++){
      if (typed[i] === targetTextArr[i]) correctChars++;
    }
    const wpm = elapsedMin > 0 ? Math.round((correctChars / 5) / elapsedMin) : 0;
    const acc = typed.length > 0 ? Math.round((correctChars / Math.max(typed.length, 1)) * 100) : 100;
    els.valWpm.textContent = wpm;
    els.valAcc.textContent = acc + '%';
    return { wpm, acc };
  }

  function startTimer(){
    if (timerId) return;
    startTime = Date.now();
    els.stageHint.textContent = strings[lang].hintRunning;
    timerId = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      timeLeft = Math.max(0, Math.round(60 - elapsed));
      els.valTime.textContent = timeLeft;
      computeLiveStats();
      if (timeLeft <= 0){
        endSession();
      }
    }, 200);
  }

  function endSession(){
    if (finished) return;
    finished = true;
    clearInterval(timerId);
    timerId = null;
    els.hiddenInput.blur();
    els.hiddenInput.disabled = true;
    els.stage.classList.add('locked');
    els.stageHint.textContent = strings[lang].hintLocked;
    const stats = computeLiveStats();
    els.resultWpm.textContent = stats.wpm;
    els.resultAcc.textContent = stats.acc + '%';
    els.resultBanner.classList.add('show');
    saveResult(stats.wpm, stats.acc);
    renderHistory();
  }

  function saveResult(wpm, acc){
    let results = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) results = JSON.parse(raw);
    } catch(e){ results = []; }
    results.unshift({
      wpm: wpm,
      acc: acc,
      lang: lang,
      date: new Date().toISOString()
    });
    results = results.slice(0, 12);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
    } catch(e){ }
  }

  function formatDate(iso){
    try {
      const d = new Date(iso);
      const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      return d.toLocaleString(lang === 'ar' ? 'ar' : 'en-US', opts);
    } catch(e){ return ''; }
  }

  function renderHistory(){
    let results = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) results = JSON.parse(raw);
    } catch(e){ results = []; }

    els.historyList.innerHTML = '';
    if (!results.length){
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = strings[lang].empty;
      els.historyList.appendChild(empty);
      return;
    }
    results.forEach(r => {
      const row = document.createElement('div');
      row.className = 'history-row';
      const left = document.createElement('div');
      left.className = 'h-left';
      const langTag = document.createElement('span');
      langTag.className = 'h-lang';
      langTag.textContent = r.lang === 'ar' ? 'AR' : 'EN';
      const dateSpan = document.createElement('span');
      dateSpan.textContent = formatDate(r.date);
      left.appendChild(langTag);
      left.appendChild(dateSpan);

      const metrics = document.createElement('div');
      metrics.className = 'h-metrics';
      const wpmSpan = document.createElement('span');
      wpmSpan.className = 'h-wpm';
      wpmSpan.textContent = r.wpm + ' ' + (lang === 'ar' ? 'ك/د' : 'wpm');
      const accSpan = document.createElement('span');
      accSpan.textContent = r.acc + '%';
      metrics.appendChild(wpmSpan);
      metrics.appendChild(accSpan);

      row.appendChild(left);
      row.appendChild(metrics);
      els.historyList.appendChild(row);
    });
  }

  function resetSession(newLang){
    if (typeof newLang === 'string') lang = newLang;
    clearInterval(timerId);
    timerId = null;
    startTime = null;
    timeLeft = 60;
    finished = false;

    targetText = pickText();
    targetTextArr = Array.from(targetText);
    applyLangStrings();
    renderText();
    
    els.hiddenInput.disabled = false;
    els.hiddenInput.value = '';
    els.hiddenInput.maxLength = targetTextArr.length;
    typed = [];
    
    updateDisplayFromTyped();

    els.valTime.textContent = 60;
    els.valWpm.textContent = 0;
    els.valAcc.textContent = '100%';
    els.resultBanner.classList.remove('show');
    els.stage.classList.remove('locked');
    
    els.btnAr.classList.toggle('active', lang === 'ar');
    els.btnEn.classList.toggle('active', lang === 'en');
    els.btnPunct.classList.toggle('active', usePunct);

    renderHistory();
    els.hiddenInput.focus();
  }

  els.hiddenInput.addEventListener('input', () => {
    if (finished) return;
    
    setTimeout(() => {
      let rawVal = els.hiddenInput.value;
      let cleanVal = rawVal.replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '').replace(/\u00A0/g, ' ');
      
      typed = Array.from(cleanVal);
      
      if (!startTime && typed.length > 0) startTimer();
      
      updateDisplayFromTyped();
      computeLiveStats();
      
      if (typed.length === targetTextArr.length){
        endSession();
      }
    }, 0);
  });

  els.stage.addEventListener('click', () => {
    if (!finished) els.hiddenInput.focus();
  });

  els.btnAr.addEventListener('click', () => { if (lang !== 'ar') resetSession('ar'); });
  els.btnEn.addEventListener('click', () => { if (lang !== 'en') resetSession('en'); });
  
  els.btnPunct.addEventListener('click', () => {
    usePunct = !usePunct;
    resetSession();
  });

  els.restartBtn.addEventListener('click', () => resetSession());

  resetSession('ar');
})();
</script>
</body>
</html>
